
name: Build LiquidBoard APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q LiquidBoard-Android-IME-phone-build.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: LiquidBoard-Android-IME
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidBoard-debug-apk
          path: LiquidBoard-Android-IME/app/build/outputs/apk/debug/app-debug.apk
          
